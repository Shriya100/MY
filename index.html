<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little Universe</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div id="glow" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>

<section id="hero" class="screen">
  <p class="hand" id="heroA">Hey, you...</p>
  <h1 id="heroB">I made something for you.</h1>
  <button id="openBtn" class="btn big">Open Our Little Universe ✨</button>
</section>

<main id="main" hidden>
  <header class="top"><h2 id="siteName"></h2><p id="siteSub"></p></header>

  <section id="story"><h2 class="sec">Our Story</h2><div id="timeline" class="timeline"></div></section>
  <section id="wall"><h2 class="sec">The Wall of Us</h2><div id="polaroids" class="wall"></div></section>
  <section id="quiz"><h2 class="sec">How well do you know us?</h2><div id="quizBox" class="panel"></div></section>
  <section id="nice"><h2 class="sec">Tell me something nice</h2><div class="panel center"><p id="complimentOut" class="big-line" aria-live="polite">Press the button 💌</p><button id="complimentBtn" class="btn">Tell me something nice 💌</button></div></section>
  <section id="jokes"><h2 class="sec">Our Extremely Serious Relationship Statistics 🔬</h2><div class="panel center lab"><p id="jokeOut" class="big-line" aria-live="polite">Findings pending...</p><button id="jokeBtn" class="btn">Give me another 😂</button></div></section>
  <section id="tot"><h2 class="sec">This or That</h2><div id="totBox" class="panel center"></div></section>
  <section id="secretSec" class="center"><button id="secretBtn" class="btn ghost"></button></section>
  <section id="letterSec"><h2 class="sec" id="letterTitle"></h2><article id="letter" class="paper" aria-live="polite"></article></section>
  <section id="finale" class="screen"><h2 id="finTitle"></h2><p id="finText" class="big-line"></p><button id="replayBtn" class="btn">Replay Our Story</button><footer id="finFoot"></footer></section>
</main>

<button id="musicBtn" class="music" aria-pressed="false" aria-label="Toggle music" hidden>♪</button>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Photo" hidden><button id="modalClose" class="btn ghost" aria-label="Close">✕</button><figure><img id="modalImg" alt=""><figcaption id="modalCap"></figcaption></figure></div>
<div id="secretScreen" class="secret" hidden><div id="secretText"></div></div>
<script src="script.js"></script>
</body>
</html>
